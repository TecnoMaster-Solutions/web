services:
  postgres:
    image: postgres:16-alpine
    container_name: vertecx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vertecx}
      POSTGRES_USER: ${POSTGRES_USER:-vertecx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertecx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vertecx} -d ${POSTGRES_DB:-vertecx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    container_name: vertecx-backend
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-vertecx}
      DB_PASS: ${POSTGRES_PASSWORD:-vertecx}
      DB_NAME: ${POSTGRES_DB:-vertecx}
      DB_SYNC: ${DB_SYNC:-true}
      DB_SSL: "false"
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:-change_me_reset}
      JWT_RESET_TTL: ${JWT_RESET_TTL:-900}
      MAIL_USER: ${MAIL_USER:-dev@example.com}
      MAIL_PASS: ${MAIL_PASS:-dev_password}
    volumes:
      - ../../backend/vertecx-api:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"

  frontend:
    container_name: vertecx-frontend
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0 -p 3000

volumes:
  postgres_data:
