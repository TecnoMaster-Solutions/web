name: Build & Push Frontend to GHCR

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "frontend/**"
      - "web/frontend/**"
      - ".github/workflows/frontend-ghcr.yml"
      - "web/.github/workflows/frontend-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug paths
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type d
          find . -maxdepth 4 -name Dockerfile
          find . -maxdepth 4 -name package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: img
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

      - name: Detect frontend path and Dockerfile
        id: frontend
        run: |
          if [ -f "./web/frontend/Dockerfile" ]; then
            echo "context=./web/frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./web/frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "frontend_path=web/frontend" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "./frontend/Dockerfile" ]; then
            echo "context=./frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "frontend_path=frontend" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DETECTED="$(find . -maxdepth 4 -type f -name Dockerfile | grep '/frontend/' | head -n 1 || true)"
          if [ -n "$DETECTED" ]; then
            CONTEXT_DIR="$(dirname "$DETECTED")"
            echo "context=$CONTEXT_DIR" >> "$GITHUB_OUTPUT"
            echo "dockerfile=$DETECTED" >> "$GITHUB_OUTPUT"
            echo "frontend_path=${CONTEXT_DIR#./}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No frontend Dockerfile found in expected paths."
          exit 1

      - name: Debug selected frontend build context
        run: |
          echo "frontend_path=${{ steps.frontend.outputs.frontend_path }}"
          echo "context=${{ steps.frontend.outputs.context }}"
          echo "dockerfile=${{ steps.frontend.outputs.dockerfile }}"
          ls -la "${{ steps.frontend.outputs.context }}"
          ls -la "${{ steps.frontend.outputs.context }}/package.json"
          ls -la "${{ steps.frontend.outputs.dockerfile }}"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.frontend.outputs.context }}
          file: ${{ steps.frontend.outputs.dockerfile }}
          no-cache: true
          pull: true
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner_lower }}/web-frontend:latest
            ghcr.io/${{ steps.img.outputs.owner_lower }}/web-frontend:${{ github.sha }}
          build-args: |
            CI=true
            NEXT_PUBLIC_API_URL=https://vertecx-api-sha-09ac69f.onrender.com
            NEXT_PUBLIC_APP_URL=http://localhost:3000
          provenance: false