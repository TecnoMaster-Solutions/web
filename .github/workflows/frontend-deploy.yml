name: frontend-deploy

on:
  workflow_run:
    workflows: ["frontend-image"]
    types: [completed]

concurrency:
  group: frontend-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}
            docker pull ghcr.io/tecnomaster-solutions/vertecx-frontend:develop
            docker stop vertecx-frontend || true
            docker rm vertecx-frontend || true
            docker run -d --name vertecx-frontend \
              --restart always \
              -p 3000:3000 \
              --env-file /ruta/en/el/servidor/.env \
              ghcr.io/tecnomaster-solutions/vertecx-frontend:develop
